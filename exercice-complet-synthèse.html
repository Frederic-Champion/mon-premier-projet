<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; font-family: sans-serif; background:#0f172a; color:#e2e8f0; }
  h1 { text-align:center; padding:30px 0 10px; }
  .stat { text-align:center; color:#94a3b8; margin:0 0 20px; }
  .recherche { display:block; width:320px; margin:0 auto 40px; padding:12px 16px; border:none; border-radius:8px; font-size:16px; }
  #conteneur { display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap:24px; max-width:1000px; margin:0 auto; padding:0 20px 80px; }
  .carte {
    position: relative;                 /* ← cadre de référence (ton aprèm !) */
    background:#1e293b; border-radius:12px; padding:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    opacity:0; transform:translateY(40px);
    transition:opacity .6s, transform .6s;
  }
  .carte.visible { opacity:1; transform:translateY(0); }
  .carte h3 { margin:0 0 6px; font-size:16px; }
  .carte .cat { color:#94a3b8; font-size:13px; margin:0 0 12px; text-transform:capitalize; }
  .carte .prix { font-size:20px; font-weight:bold; }
  .badge {
    position:absolute; top:12px; right:12px;   /* ← épinglé dans le coin */
    padding:4px 10px; border-radius:6px; font-size:11px; font-weight:bold;
  }
  .badge.ok { background:#16a34a; color:white; }
  .badge.faible { background:#e11d48; color:white; }
</style>
</head>
<body>
  <h1>Catalogue — Optique Champion</h1>
  <p class="stat" id="stat"></p>
  <input type="text" class="recherche" placeholder="Rechercher un produit...">
  <div id="conteneur"></div>
  <script>
    
    const input = document.querySelector("input");
    const conteneur = document.querySelector("#conteneur");
    const stat = document.querySelector("#stat");
    let data = [];

    const observer = new IntersectionObserver((entries) => {
        for (let entry of entries) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
            }
        }
    })

    function afficher(produits) {
        conteneur.innerHTML = "";
        for (let produit of produits) {
            const carte = document.createElement("div");
            carte.className = "carte";
            carte.innerHTML = `
                <h3>${produit.title}</h3>
                <p class="cat">${produit.category}</p>
                <p class="prix">${produit.price} €</p>
                <span class="badge ${produit.stock < 50 ? "faible" : "ok"}">
                    ${produit.stock < 50 ? "Stock limité" : "En stock"}
                </span> 
            `
            observer.observe(carte);
            conteneur.appendChild(carte);
        }
    }

    async function recupDonnees() {
        try {
            const reponse = await fetch("https://dummyjson.com/products?limit=12");
            data = await reponse.json();
            afficher(data.products)
            let mapPrice = data.products.map(prix => prix.price)
            let statCalcul = mapPrice.reduce((acc, prix) => {
                    return acc + prix
                }, 0)
            stat.innerHTML = `
                ${(statCalcul / mapPrice.length).toFixed(2)}
            `
        } catch (erreur) {
            console.log("ça a planté :", erreur);
            conteneur.innerHTML = "<p>Impossible de charger les produits</p>";
        }
        
    }

    recupDonnees()

    input.addEventListener("input", () => {
        const filtrer = data.products.filter(touches => touches.title.toLowerCase().includes(input.value.toLowerCase()));
        afficher(filtrer)
    })



  </script>
</body>
</html>
