<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Exercice1</title>
    </head>
    <body>
        <h1>PAGE BLANCHE QUI SERT A 'pas grand chose'</h1>
        <input id="question" type= "text" placeholder="Nom du pok ?">
        <button id="ajouter" type="submit" >add</button>
        <p id="error"></p>
        <h2 id="nom" ></h2>
        <p id="xp" ></p>
        <script>

            const nomPok = document.querySelector("#nom");
            const xpPok = document.querySelector("#xp");
            const ajouter = document.querySelector("#ajouter");
            const question = document.querySelector("#question");
            const error = document.querySelector("#error");

            async function getPokemon(nom) {
                try {
                    const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${nom}`)
                    const data = await response.json()
                    nomPok.textContent = `nom du pok ${data.name}` ;
                    xpPok.textContent = `Expérience de base : ${data.base_experience}`;
                } catch (erreur) {
                    error.textContent = "Pokémon introuvable !"
                    setTimeout(() => {error.textContent = ""}, 2000)
                    console.log("Impossible de récupérer les données :", erreur)
                }
            }

            ajouter.addEventListener("click", () => {
                getPokemon(question.value)
            });           

        </script>
    </body>
</html>
