<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { background: #0f172a; font-family: sans-serif; padding: 60px; }

    .carte {
      width: 250px;
      padding: 24px;
      background: #1e293b;
      color: white;
      border-radius: 12px;
      /* 👉 LIGNE 1 : à compléter */position: relative;
    }

    .badge {
      background: #e11d48;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      /* 👉 LIGNE 2 : à compléter */position: absolute;
      top: 10px;
      right: 10px;
    }

    .carte h3 { margin: 0 0 8px; }
    .carte p { margin: 0; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="carte">
    <span class="badge">Promo</span>
    <h3>Ray-Ban Aviator</h3>
    <p>149 €</p>
  </div>
</body>
</html>
