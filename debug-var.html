<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Debug var</title>
  </head>
  <body>
    <script>
      function avecVar() {
        for (var i = 0; i < 3; i++) {
          setTimeout(() => {
            console.log("var :", i);
            debugger;
          }, 100);
        }
      }

      function avecLet() {
        for (let j = 0; j < 3; j++) {
          setTimeout(() => {
            console.log("let :", j);
          }, 100);
        }
      }

      avecVar();
      avecLet();
    </script>
  </body>
</html>
