<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>introduction tailwind</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="output.css">
    </head>

    <body>
        <main>
            <button id="btn">Clique ici</button>
            <section id="boite">Je suis une section</section>
        </main>

        <script>
            const btn = document.querySelector("#btn");
            const boite = document.querySelector("#boite");

            btn.addEventListener("click", (action) => {
                console.log(action.target)
            });

            function consigneTrucsVisibles(toutes) {
                for (let chaque of toutes) {
                    console.log(`élément visible : ${chaque.target}`)
                }
            }
            const vigile = new IntersectionObserver(consigneTrucsVisibles)
            vigile.observe(boite)

        </script>
    </body>
</html>
