<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice</title>
    <style>

        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {background-color: rgb(193, 195, 196); font-weight: 300; display: flex; flex-direction: column;}
        input {width: 500px; margin-top: 30px; padding: 8px ;align-self: center;}
        .carte {background-color: white; margin: 16px; border-radius: 8px; font-size: large; padding: 0 8px;}

    </style>
</head>
<body>

    <input type="text" placeholder="tape">
    <div id="cartes"></div>

    <script>

        const input = document.querySelector("input");
        const cartes = document.querySelector("#cartes");
        let data = [];

        function creerCarte(listes) {
            cartes.innerHTML = "";
            for (let liste of listes) {                
                const carte = document.createElement("div");
                carte.className = "carte";
                carte.innerHTML = `
                    <p>titre : ${liste.title}</p>
                    <p>body : ${liste.body}</p>
                    <p>identifiant : ${liste.userId}</p>
                `;
                cartes.appendChild(carte)
            }
        }

        async function recupDonnees() {
            const reponse =  await fetch("https://jsonplaceholder.typicode.com/posts");
            data = await reponse.json();
            creerCarte(data)
        }

        recupDonnees()

        input.addEventListener("input", () => {
            const dataFiltrees = data.filter(post => post.title.toLowerCase().includes(input.value.toLowerCase()));
            creerCarte(dataFiltrees);
        });

    </script>
    
</body>
</html>
