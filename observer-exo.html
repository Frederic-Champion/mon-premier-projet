<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Observer Exercice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; color: white; font-family: sans-serif; }

    .espaceur {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #666;
    }

    .section-animee {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 2rem;
      border-radius: 1rem;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s, transform 0.6s;
    }

    .section-animee.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #montures { background: #16213e; }
    #verres   { background: #0f3460; }
    #lentilles { background: #533483; }
    #contact  { background: #1a5276; }
  </style>
</head>
<body>
  <div class="espaceur">↓ Scrolle vers le bas ↓</div>
  <section class="section-animee" id="montures">Montures</section>
  <div class="espaceur"></div>
  <section class="section-animee" id="verres">Verres</section>
  <div class="espaceur"></div>
  <section class="section-animee" id="lentilles">Lentilles</section>
  <div class="espaceur"></div>
  <section class="section-animee" id="contact">Contact</section>

  <script>
    // TON CODE ICI
    const sectionAnimee = document.querySelectorAll(".section-animee");

    const vigile = new IntersectionObserver((entries) => {
        for (let entry of entries) {
            if (entry.isIntersecting) {
                entry.target.classList.add("visible");
            } else {
                entry.target.classList.remove("visible");
            }
        }
    });

    for (let section of sectionAnimee) {
        vigile.observe(section)
    }

  </script>
</body>
</html>
