<!DOCTYPE html>

    <body>
        <h1>PAGE BLANCHE QUI SERT A RIEN</h1>
        <script>

            const analyserNotes = (notes) => {
                for (let note of notes) {
                    if (note === -1) {
                        break;
                    }
                    if (note < 0 || note > 20) {
                        continue;
                    }
                    if (note >= 18) {
                        return "Très Bien !";
                    }
                }
                return "pas de mention TB"
            };
            console.log(analyserNotes([12, 25, 15, 18, 10]));
            console.log(analyserNotes([12, -1, 19, 10]));
            console.log(analyserNotes([12, 15, 10]));


        </script>
    </body>
</html>
